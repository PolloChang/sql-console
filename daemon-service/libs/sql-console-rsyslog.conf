# /etc/rsyslog.d/40-sql-console.conf
# rsyslog configuration for sql-console audit logs in Debian 12

# Ensure imfile module is loaded (Debian 12 supports modern parameter syntax)
module(load="imfile")

# Monitor sql-console audit.log
input(type="imfile"
      File="/var/log/sql-console/audit.log"
      Tag="sql-console-audit"
      Severity="info"
      Facility="local0"
      persistStateInterval="1"
      reopenOnTruncate="on")

# -----------------------------------------------------------------
# Forwarding Configuration (Uncomment as needed)
# -----------------------------------------------------------------
# Use TCP for reliable auditing
# local0.* @@remote-host:514

# Or traditional UDP forwarding
# local0.* @remote-host:514
